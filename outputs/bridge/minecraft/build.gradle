plugins { id 'fabric-loom' version '1.7.4' }
version = '0.4.11'
group = 'local.gdbridge'
layout.buildDirectory = file(providers.gradleProperty('gdbridgeBuildDirectory').getOrElse('../../../work/minecraft-build'))
loom { accessWidenerPath = file('src/main/resources/gdbridge.accesswidener'); runs { client { runDir '../../launcher/data/instances/gdbridge/.minecraft' } } }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.6+1.20.1'
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17; withSourcesJar() }
